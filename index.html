function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);

let ac = null;
function initAudio(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }
function beep(freq, dur, type='square', vol=0.06, slide=0){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}

  nextWave();
}

function spawnPos(){
  let x, y;
  do { x = rnd(20, W - 20); y = rnd(50, H - 20); } while (Math.hypot(x - player.x, y - player.y) < 220);
  return [x, y];
}

function nextWave(){
  wave++;
  const boss = wave % 4 === 0;
  const n = boss ? Math.floor(wave / 2) + 1 : 3 + wave * 2;
  for (let i = 0; i < n; i++) {
    const [x, y] = spawnPos();
    const big = wave > 2 && Math.random() < 0.2;
    let kind = 'blob'; const rr = Math.random();

    const sm = kind !== 'blob';
    enemies.push({ x, y, kind, r: sm ? 13 : (big ? 18 : 12), hp: kind === 'hater' ? 3 : (sm ? 2 : (big ? 4 : 2)), dmg: 1,

      kx: 0, ky: 0, flash: 0, big: big && !sm, wob: Math.random() * 6, stun: 0, shootT: rnd(1, 2.5), dodgeCd: 0, dodgeT: 0, dvx: 0, dvy: 0 });
  }
  if (boss) {
    const [x, y] = spawnPos();
    const dragon = wave % 8 === 0;

    beep(100, 0.8, 'sawtooth', 0.1, 80);
    say('boss', true);
  }
  popup(W/2, H/2 - 60, 'WAVE ' + wave, '#fff');
}

function popup(x, y, text, color){ popups.push({ x, y, text, color, t: 0 }); }

function spawnParts(x, y, color, n=10){

    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(15, 30), color });

function swing(){
  if (state !== 'play' || player.swingT > 0) return;
  player.swingT = 1;
  player.swingDir = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.hitList.clear();
  beep(500, 0.12, 'sawtooth', 0.05, -300);
}

const SWING_LEN = 0.22;

function useItem(){
  if (state !== 'play' || itemCd > 0 || hook) return;
  const it = ITEMS[sel], p = player;
  const a = Math.atan2(mouse.y - p.y, mouse.x - p.x);

  popup(p.x, p.y - 36, it.quip, it.color);

    const np = 5 + 2 * it.lvl;
    for (let i = 0; i < np; i++) {
      const ang = a + Math.PI + (i - (np - 1) / 2) * 0.16;
      shots.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 700, vy: Math.sin(ang) * 700, life: 0.7 });
    }
    p.vx += Math.cos(a) * 5; p.vy += Math.sin(a) * 5; // recoil flings you forward
    shake = Math.max(shake, 5);
    beep(240, 0.18, 'sawtooth', 0.08, -150);
    return;

  hook = { x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), dist: 0, max: itemRange(it), type: sel, state: 'out', target: null, t: 0, px: 0, py: 0 };

}

function hurt(e, dmg, kx, ky){
  if (e.dead) return;
  if (e.kind === 'dragon' && e.noisy) { popup(e.x, e.y - 44, 'NOISY! WAIT FOR DENOISE', '#fff'); beep(150, 0.08, 'square', 0.05); return; }
  e.hp -= dmg; e.flash = 8; e.kx += kx; e.ky += ky;
  shake = Math.max(shake, 6); beep(180, 0.1, 'square', 0.07, -100);
  spawnParts(e.x, e.y, '#ffeb3b', 8);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  e.dead = true;
  if (e.kind === 'slop' && !e.child) { // slop regenerates: 2 smaller, faster copies
    for (let i = 0; i < 2; i++) enemies.push({ x: e.x + rnd(-12, 12), y: e.y + rnd(-12, 12), kind: 'slop', child: true, r: 9, hp: 1, dmg: 1, speed: 1.7, kx: 0, ky: 0, flash: 0, big: false, wob: Math.random() * 6, stun: 0, shootT: 0, dodgeCd: 0, dodgeT: 0, dvx: 0, dvy: 0 });
    popup(e.x, e.y - 22, 'REGENERATING (7 FINGERS)', '#f0f');
  }
  kills++; streak++; streakT = 2.2; if (streak === 5) dlssMoment();
  if (streak >= 3) { say('streak'); popup(W/2, 120, 'x' + streak + ' ' + pick(['COMBO!', 'KILLSHOT!', 'SHOTS FIRED!', 'RECOMPILED!']), '#ff0'); score += 1; }
  spawnParts(e.x, e.y, e.boss ? '#f0f' : e.big ? '#a0f' : '#e22', e.boss ? 60 : 20);
  if (e.boss) {
    for (let i = 0; i < 8; i++) items.push({ x: e.x + rnd(-40, 40), y: e.y + rnd(-40, 40), type: i < 2 ? 'heart' : 'blue', t: 0 });
    popup(e.x, e.y - 40, e.kind === 'dragon' ? 'NOISE FLOOR DELETED' : 'GENERATED FRAMES DELETED', '#0ff');
    items.push({ x: e.x, y: e.y + 30, type: 'up', slot: Math.floor(Math.random() * 4), t: 0 });
    dlssMoment();
    shake = 20;
  } else {
    const r = Math.random();
    if (Math.random() < 0.08) items.push({ x: e.x, y: e.y, type: 'up', slot: Math.floor(Math.random() * 4), t: 0 });
    if (r < 0.2) items.push({ x: e.x, y: e.y, type: 'heart', t: 0 });
    else if (r < 0.7) items.push({ x: e.x, y: e.y, type: e.big ? 'blue' : 'green', t: 0 });
  }
  beep(300, 0.2, 'square', 0.07, 400);
}

function collideTrees(o){
  for (const t of trees) {
    const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy), min = o.r + t.r - 4;

  o.y = Math.max(o.r + 30, Math.min(H - o.r, o.y));
}

  for (const w of words) {

  if (fly.length > 11) fly.shift();

function say(kind, force){

}
function updateComments(dt){

function drawComments(){

// ---------- update ----------
let last = performance.now();
let introT = 10;
function update(dt){
  time += dt;
  if (state === 'boot') bootT += dt;

  // toasts + frame-gen glitch events
  nextToast -= dt;
  if (nextToast <= 0) { toast = { text: pick(TOASTS), t: 0 }; nextToast = rnd(5, 9); }
  if (toast) { toast.t += dt; if (toast.t > 3.2) toast = null; }
  nextGlitch -= dt;
  if (nextGlitch <= 0) { glitchT = mfgOn ? 0.9 : 0; nextGlitch = rnd(7, 13); }
  if (glitchT > 0) glitchT -= dt;
  updateComments(dt);
  updateMusic(dt);
  updateDrama(dt);
  nextHot -= dt;
  if (nextHot <= 0 && state === 'play' && !menuOpen && !modal) { hot = { title: pick(HOT_TITLES), score: pick(['12.4k', '8.1k', '69.4k', '420', '3.3k', '99.9k']), comments: pick(['3.1k', '412', '1.2k', '69', '8.8k']), t: 0 }; nextHot = rnd(18, 30); }
  if (hot) { hot.t += dt; if (hot.t > 5) hot = null; }

  if (state !== 'play') return;
  if (menuOpen) return;
  if (modal) {
    modal.t += dt;
    if (modal.kind === 'crash' && modal.t > 3) endModal(false);
    else if (modal.kind !== 'crash' && modal.t > 9) endModal(modal.kind === 'update');
    return;
  }
  runTime += dt;
  nextCrash -= dt; nextUpd -= dt;
  if (nextCrash <= 0) { startModal('crash'); nextCrash = rnd(50, 80); nextUpd = Math.max(nextUpd, 20); return; }
  if (nextUpd <= 0) { startModal(Math.random() < 0.5 ? 'virus' : 'update'); nextUpd = rnd(75, 110); nextCrash = Math.max(nextCrash, 20); return; }
  updateFaction(dt);
  const p = player;
  if (streakT > 0) { streakT -= dt; if (streakT <= 0) streak = 0; }

  // movement
  let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
  const sp = p.swingT > 0 ? 100 : 170;
  p.x += dx * sp * dt + p.vx; p.y += dy * sp * dt + p.vy;
  p.vx *= 0.8; p.vy *= 0.8;
  collideTrees(p);
  p.face = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  if (p.inv > 0) p.inv -= dt;

  // swing
  if (p.swingT > 0) {
    p.swingT -= dt / SWING_LEN;
    const prog = 1 - Math.max(0, p.swingT);
    const ang = p.swingDir - 1.2 + prog * 2.4;
    for (const e of enemies) {
      if (e.dead || p.hitList.has(e)) continue;
      const ex = e.x - p.x, ey = e.y - p.y, d = Math.hypot(ex, ey);
      if (d < SWORD_RANGE + e.r) {
        let da = Math.atan2(ey, ex) - ang;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) < 0.7) {
          p.hitList.add(e);
          hurt(e, 1, ex / d * (e.boss ? 3 : 9), ey / d * (e.boss ? 3 : 9));
        }
      }
    }
  }

  updateItems(dt);

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.wob += dt * 8;
    const ex = p.x - e.x, ey = p.y - e.y, d = Math.hypot(ex, ey) || 1;
    if (e.stun > 0) e.stun -= dt;
    else moveEnemy(e, ex, ey, d, dt);
    e.x += e.kx; e.y += e.ky;
    e.kx *= 0.7; e.ky *= 0.7;
    if (e.flash > 0) e.flash--;
    if (e.boss) { e.histT = (e.histT || 0) + dt; if (e.histT > 0.07) { e.histT = 0; e.hist.unshift({ x: e.x, y: e.y }); if (e.hist.length > 16) e.hist.pop(); } }
    collideTrees(e);
    if (d < e.r + p.r && p.inv <= 0) {
      p.hp -= e.dmg; p.inv = 1; shake = 12;
      p.vx = -ex / d * 6; p.vy = -ey / d * 6;
      beep(120, 0.25, 'sawtooth', 0.08, -60);
      spawnParts(p.x, p.y, '#f44', 14);
      if (p.hp <= 0) playerDied();
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // pickups
  for (const it of items) {
    it.t += dt;
    if (Math.hypot(it.x - p.x, it.y - p.y) < 20) {
      it.dead = true;
      if (it.type === 'up') upgrade(it.slot);
      else if (it.type === 'heart') { p.hp = Math.min(p.maxhp, p.hp + 2); popup(it.x, it.y, '+HP', '#f66'); beep(880, 0.15, 'triangle', 0.07, 400); }
      else { score += it.type === 'blue' ? 5 : 1; popup(it.x, it.y, it.type === 'blue' ? '+5' : '+1', '#6cf'); beep(1200, 0.08, 'triangle', 0.06, 300); }
    }
  }
  items = items.filter(i => !i.dead);

  if (enemies.length === 0) nextWave();

  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vx *= 0.93; q.vy *= 0.93; q.life--; }
  particles = particles.filter(q => q.life > 0);
  for (const q of popups) { q.t += dt; q.y -= 20 * dt; }
  popups = popups.filter(q => q.t < 1.2);
  if (shake > 0) shake *= 0.85;
}

const DEATH = [
  'Upstream: gone. You: also gone.',
  'Skill issue (not a recomp bug)',
  'Backshoots did not save you',
  'Try the Longshot. It is longer.',
  'DLSS 5 hallucinated your health bar',
  'rc.1 of dying',
];
let deathLine = DEATH[0];

function updateItems(dt){
  const p = player;
  if (itemCd > 0) itemCd -= dt;

  // enemy projectiles (arrows, dragon fireballs). swords can parry them.
  for (const s of eshots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < -20 || s.x > W + 20 || s.y < 20 || s.y > H + 20) { s.dead = true; continue; }
    if (p.swingT > 0) {
      const dx = s.x - p.x, dy = s.y - p.y, d = Math.hypot(dx, dy);
      if (d < SWORD_RANGE + 6) {
        let da = Math.atan2(dy, dx) - (p.swingDir - 1.2 + (1 - Math.max(0, p.swingT)) * 2.4);
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) < 0.9) { s.dead = true; popup(s.x, s.y, 'PARRY!', '#fff'); beep(1400, 0.06, 'triangle', 0.07); spawnParts(s.x, s.y, '#fff', 6); score += 1; continue; }
      }
    }
    if (p.inv <= 0 && Math.hypot(s.x - p.x, s.y - p.y) < p.r + s.r) { damagePlayer(s.dmg || 1, s.vx, s.vy); s.dead = true; continue; }
    for (const t of trees) if (Math.hypot(s.x - t.x, s.y - t.y) < t.r) { s.dead = true; break; }
  }
  eshots = eshots.filter(s => !s.dead);

  // backshoots pellets
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < 0 || s.x > W || s.y < 30 || s.y > H) { s.dead = true; continue; }
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 4) { hurt(e, 1, s.vx * 0.006, s.vy * 0.006); s.dead = true; break; }
    }
  }
  shots = shots.filter(s => !s.dead);

  if (!hook) return;
  const h = hook, it = ITEMS[h.type];
  h.t += dt;

  if (h.state === 'out') {
    const step = 900 * dt;
    h.x += h.dx * step; h.y += h.dy * step; h.dist += step;
    for (const e of enemies) {
      if (e.dead || Math.hypot(e.x - h.x, e.y - h.y) > e.r + 6) continue;
      if (e.kind === 'hater' && h.type === 0) {
        popup(e.x, e.y - 26, 'HOOKSHOT SUCKS', '#f66'); h.state = 'back'; p.vx -= h.dx * 9; p.vy -= h.dy * 9;
        shake = Math.max(shake, 8); beep(110, 0.2, 'sawtooth', 0.07, -40); say('hook', true); return;
      }
      h.target = e; beep(700, 0.08, 'square', 0.07, 300);
      if (h.type === 2) { h.state = 'reel'; h.t = 0; }
      else { hurt(e, itemDmg(it), h.dx * 5, h.dy * 5); h.state = 'pull'; h.t = 0; h.px = e.x; h.py = e.y; }
      return;
    }
    for (const t of trees) {
      if (Math.hypot(t.x - h.x, t.y - h.y) > t.r) continue;
      beep(1000, 0.06, 'triangle', 0.07);
      if (h.type === 2) { h.state = 'back'; popup(t.x, t.y - 30, 'nothing to claw', '#fff'); }
      else { h.state = 'pull'; h.t = 0; h.px = t.x; h.py = t.y; h.target = null; }
      return;
    }
    if (h.dist >= h.max || h.x < 0 || h.x > W || h.y < 30 || h.y > H) h.state = 'back';
  } else if (h.state === 'back') {
    const d = Math.hypot(p.x - h.x, p.y - h.y) || 1;
    h.x += (p.x - h.x) / d * 1400 * dt; h.y += (p.y - h.y) / d * 1400 * dt;
    if (d < 16) hook = null;
  } else if (h.state === 'pull') {
    if (h.target && !h.target.dead) { h.px = h.target.x; h.py = h.target.y; }
    h.x = h.px; h.y = h.py;
    const d = Math.hypot(h.px - p.x, h.py - p.y) || 1;
    const stop = (h.target ? h.target.r : 18) + p.r + 2;
    p.inv = Math.max(p.inv, 0.25);
    if (d <= stop || h.t > 1.2) { p.inv = Math.max(p.inv, 0.5); hook = null; return; }
    p.x += (h.px - p.x) / d * 750 * dt; p.y += (h.py - p.y) / d * 750 * dt;
  } else if (h.state === 'reel') {
    const e = h.target;
    if (!e || e.dead) { hook = null; return; }
    h.x = e.x; h.y = e.y;
    const d = Math.hypot(p.x - e.x, p.y - e.y) || 1;
    e.stun = 0.4;
    if (d < p.r + e.r + 10 || h.t > 1.2) { hurt(e, itemDmg(it), 0, 0); popup(e.x, e.y - 24, 'CLAW!', '#e040fb'); hook = null; return; }
    const pullStr = e.boss ? 250 : 650;
    e.x += (p.x - e.x) / d * pullStr * dt; e.y += (p.y - e.y) / d * pullStr * dt;
  }
}

// ---------- drawing ----------
function drawGround(){
  ctx.fillStyle = '#2f8a2f'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 40) for (let x = 0; x < W; x += 40) {
    if (((x + y) / 40) % 2 === 0) { ctx.fillStyle = '#2a7f2a'; ctx.fillRect(x, y, 40, 40); }
  }
  ctx.fillStyle = '#a8803f'; ctx.fillRect(0, H/2 - 25, W, 50);
}

function drawTree(t){
  ctx.fillStyle = '#5b3a1a'; ctx.fillRect(t.x - 5, t.y, 10, 20);
  ctx.fillStyle = '#145214'; ctx.beginPath(); ctx.arc(t.x, t.y - 4, t.r, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#1d7a1d'; ctx.beginPath(); ctx.arc(t.x - 4, t.y - 8, t.r * 0.6, 0, 6.28); ctx.fill();
}

function blob(e, x, y, color){
  const sq = 1 + Math.sin(e.wob) * 0.12;
  ctx.save(); ctx.translate(x, y); ctx.scale(1 / sq, sq);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-e.r * 0.5, -e.r * 0.3, e.r * 0.4, e.r * 0.4); ctx.fillRect(e.r * 0.1, -e.r * 0.3, e.r * 0.4, e.r * 0.4);
  ctx.fillStyle = '#000'; ctx.fillRect(-e.r * 0.35, -e.r * 0.15, 3, 3); ctx.fillRect(e.r * 0.25, -e.r * 0.15, 3, 3);
  ctx.restore();
}

function drawEnemy(e){
  if (e.kind === 'dragon') { drawDragon(e); return; }
  if (e.boss) {
    // the "generated frames": laggy ghost copies. only the real one hurts.
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '10px monospace';
    for (let k = 3; k >= 1; k--) {
      const g = e.hist[k * 3]; if (!g) continue;
      ctx.globalAlpha = 0.22; blob(e, g.x, g.y, '#c0f'); ctx.globalAlpha = 1;
      if (k === 1) { ctx.fillStyle = '#fff'; ctx.fillText('GENERATED FRAME', g.x, g.y - e.r - 10); }
    }
    blob(e, e.x, e.y, e.flash ? '#fff' : '#6a0dad');
    ctx.fillStyle = '#ffd700'; // crown
    ctx.beginPath(); ctx.moveTo(e.x - 18, e.y - e.r + 2); ctx.lineTo(e.x - 18, e.y - e.r - 14); ctx.lineTo(e.x - 8, e.y - e.r - 5);
    ctx.lineTo(e.x, e.y - e.r - 16); ctx.lineTo(e.x + 8, e.y - e.r - 5); ctx.lineTo(e.x + 18, e.y - e.r - 14); ctx.lineTo(e.x + 18, e.y - e.r + 2); ctx.fill();
    ctx.fillStyle = '#0f0'; ctx.fillText('REAL FRAME', e.x, e.y + e.r + 12);
    ctx.fillStyle = '#400'; ctx.fillRect(e.x - 30, e.y - e.r - 26, 60, 5);
    ctx.fillStyle = '#f33'; ctx.fillRect(e.x - 30, e.y - e.r - 26, 60 * Math.max(0, e.hp / e.maxhp), 5);
    return;
  }
  const col = e.flash ? '#fff' : e.stun > 0 ? '#e040fb' : e.kind === 'dodger' ? '#00bcd4' : e.kind === 'archer' ? '#ff9800' : e.kind === 'slop' ? `hsl(${(time * 300 + e.wob * 40) % 360},80%,55%)` : e.kind === 'hater' ? '#607d8b' : e.big ? '#7a1fa2' : '#c62828';
  blob(e, e.x, e.y, col);
  if (e.kind === 'archer') { // little bow facing the player
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, a - 0.9, a + 0.9); ctx.stroke();
  } else if (e.kind === 'hater') { // protest sign
    ctx.fillStyle = '#fff'; ctx.fillRect(e.x - 21, e.y - e.r - 22, 42, 13); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(e.x - 21, e.y - e.r - 22, 42, 13);
    ctx.fillStyle = '#d00'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('NO HOOK', e.x, e.y - e.r - 15);
  } else if (e.kind === 'dodger') {
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(e.x - e.r - 4, e.y + k * 5); ctx.lineTo(e.x - e.r - 14, e.y + k * 5); ctx.stroke(); }
  } else if (e.kind === 'slop') { // wrong number of fingers, on purpose
    ctx.strokeStyle = '#fcd'; ctx.lineWidth = 2;
    for (let k = 0; k < 7; k++) { const a = -2.6 + k * 0.33; ctx.beginPath(); ctx.moveTo(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r); ctx.lineTo(e.x + Math.cos(a) * (e.r + 7), e.y + Math.sin(a) * (e.r + 7)); ctx.stroke(); }
    if (!e.child) { ctx.fillStyle = '#fff'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('AI SLOP', e.x, e.y + e.r + 12); }
  }
}

function drawPlayer(){
  const p = player;
  if (p.inv > 0 && Math.floor(time * 20) % 2) return;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 12, 5, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#3aa63a'; ctx.fillRect(p.x - 10, p.y - 6, 20, 20);
  ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(p.x, p.y - 8, 9, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#2e8b2e'; ctx.beginPath(); ctx.moveTo(p.x - 10, p.y - 10); ctx.lineTo(p.x + 10, p.y - 10); ctx.lineTo(p.x + 14, p.y - 26); ctx.closePath(); ctx.fill();
  const lx = Math.cos(p.face) * 2, ly = Math.sin(p.face) * 2;
  ctx.fillStyle = '#000'; ctx.fillRect(p.x - 4 + lx, p.y - 8 + ly, 2, 3); ctx.fillRect(p.x + 2 + lx, p.y - 8 + ly, 2, 3);
  // "DLSS 5 neural face": sparkle on the cheek
  if (Math.floor(time * 4) % 2) { ctx.fillStyle = '#fff'; ctx.fillRect(p.x + 5, p.y - 12, 2, 2); ctx.fillRect(p.x + 4, p.y - 11, 4, 0.8); }

  let a = p.swingT > 0 ? p.swingDir - 1.2 + (1 - p.swingT) * 2.4 : p.face;
  const len = p.swingT > 0 ? SWORD_RANGE : 26;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a);
  if (p.swingT > 0) { // rainbow swoosh, obviously
    ctx.fillStyle = `hsla(${(time * 720) % 360},100%,70%,.5)`;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, -0.9, 0.1); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(8, -2, 8, 4);
  ctx.fillStyle = '#ffd54f'; ctx.fillRect(14, -6, 4, 12);
  ctx.fillStyle = '#e8f4ff'; ctx.fillRect(18, -2.5, len - 12, 5);
  ctx.fillStyle = '#fff'; ctx.fillRect(18, -1, len - 12, 1.5);
  ctx.restore();
}

function drawHook(){
  for (const s of eshots) {

    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03); ctx.stroke();
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.28); ctx.fill();

  ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(h.x, h.y); ctx.stroke(); ctx.setLineDash([]);

// ---------- enemy behaviour ----------
function moveEnemy(e, ex, ey, d, dt){
  const sp = e.speed * 60 * dt;
  if (e.kind === 'archer') {
    const dir = d > 230 ? 1 : d < 160 ? -1 : 0;
    e.x += ex / d * sp * dir + (-ey / d) * sp * 0.5; e.y += ey / d * sp * dir + (ex / d) * sp * 0.5;
    e.shootT -= dt;
    if (e.shootT <= 0) { e.shootT = rnd(1.6, 2.6); eshots.push({ x: e.x, y: e.y, vx: ex / d * 260, vy: ey / d * 260, life: 2.5, r: 4, dmg: 1 }); beep(400, 0.08, 'square', 0.04, -150); }
  } else if (e.kind === 'dodger') {
    if (e.dodgeCd > 0) e.dodgeCd -= dt;
    if (e.dodgeT > 0) { e.dodgeT -= dt; e.x += e.dvx * dt; e.y += e.dvy * dt; return; }
    const threat = e.dodgeCd <= 0 && ((hook && hook.state === 'out' && Math.hypot(hook.x - e.x, hook.y - e.y) < 140) || (player.swingT > 0 && d < 90));
    if (threat) {
      const hx = hook ? hook.dx : ex / d, hy = hook ? hook.dy : ey / d, side = Math.random() < 0.5 ? 1 : -1;
      e.dvx = -hy * side * 420; e.dvy = hx * side * 420; e.dodgeT = 0.25; e.dodgeCd = 1.0; popup(e.x, e.y - 22, 'dodge!', '#0ff');
    } else { e.x += ex / d * sp; e.y += ey / d * sp; }
  } else if (e.kind === 'dragon') {
    e.x += ex / d * sp; e.y += ey / d * sp;
    e.phaseT -= dt;
    if (e.noisy) e.noiseP = Math.max(0, Math.min(1, 1 - e.phaseT / 2.2));
    if (e.phaseT <= 0) {
      e.noisy = !e.noisy; e.phaseT = e.noisy ? 2.2 : 3.2;
      if (!e.noisy) { popup(e.x, e.y - 56, 'DENOISED!', '#0ff'); beep(900, 0.15, 'triangle', 0.07, 500); } else popup(e.x, e.y - 56, 'DENOISING...', '#aaa');
    }
    e.shootT -= dt;
    if (e.shootT <= 0) {
      e.shootT = 2.4;
      for (let k = -1; k <= 1; k++) { const a = Math.atan2(ey, ex) + k * 0.3; eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 3, r: 7, dmg: 1 }); }
      beep(150, 0.2, 'sawtooth', 0.06, -60);
    }
  } else { e.x += ex / d * sp; e.y += ey / d * sp; }
}

function drawDragonBody(e, x, y, ghost){

function drawBoot(){

    'BACKSHOOTS RECOMP LAUNCHER  v∞.0.0-rc.∞',
    '> looking for upstream ............ gone',

    '> applying Backshoots (nobody asked) ok',
    '> applying Comeshot patches ..... pending',
  ];
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = '16px monospace';
  const n = Math.min(lines.length, Math.floor(bootT / 0.5) + 1);
  for (let i = 0; i < n; i++) { ctx.fillStyle = i === 0 ? '#0ff' : '#0f0'; ctx.fillText(lines[i], 30, 24 + i * 24); }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 72px Impact, sans-serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
  ctx.save(); ctx.translate(W/2, 340); ctx.rotate(Math.sin(time * 3) * 0.03);
  ctx.strokeText('BACKSHOOTS', 0, 0); ctx.fillStyle = `hsl(${(time * 240) % 360},100%,60%)`; ctx.fillText('BACKSHOOTS', 0, 0);
  ctx.restore();
  ctx.font = '16px "Comic Sans MS", sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('the recomp of the recomps of the recomps', W/2, 392);

  const ready = bootT >= BOOT_LEN, pr = ready ? 1 : Math.min(0.99, bootT / BOOT_LEN);
  ctx.fillStyle = '#222'; ctx.fillRect(30, 430, W - 60, 22);
  ctx.fillStyle = ready ? '#0f0' : '#0af'; ctx.fillRect(30, 430, (W - 60) * pr, 22);
  ctx.font = '14px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(ready ? 'shaders compiled: 100% (it is a browser game)' : 'compiling shaders ' + Math.floor(pr * 100) + '% ' + (pr >= 0.99 ? '(always 99% for a while, that is normal)' : ''), W/2, 441);
  if (ready && Math.floor(time * 3) % 2) {
    ctx.font = 'bold 30px Impact, sans-serif'; ctx.fillStyle = '#ff0'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    ctx.strokeText('CLICK TO PLAY (AT 60 FPS)', W/2, 500); ctx.fillText('CLICK TO PLAY (AT 60 FPS)', W/2, 500);

function draw(dt){
  if (state === 'boot') { drawBoot(); drawFlashers(dt); drawComments(); drawBadges(); return; }

  ctx.save();
  if (shake > 0.5) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  applyZoom();
  drawGround();
  const objs = [];
  trees.forEach(t => objs.push({ y: t.y, f: () => drawTree(t) }));
  enemies.forEach(e => objs.push({ y: e.y, f: () => drawEnemy(e) }));
  objs.push({ y: player.y, f: drawPlayer });
  objs.sort((a, b) => a.y - b.y).forEach(o => o.f());
  items.forEach(drawItem);
  drawHook();
  for (const q of particles) { ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 3, 3); }
  ctx.restore();

  postFX();
  frameGenGhosting();
  drawDLSSMoment();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of popups) {
    ctx.globalAlpha = 1 - q.t / 1.2; ctx.font = 'bold 22px "Comic Sans MS", sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y); ctx.globalAlpha = 1;
  }

  drawFlashers(dt);
  drawComments();
  drawHot();
  drawDrama();
  drawEnemyMarkers();
  drawBadges();
  drawTitle();
  drawHUD();
  drawFaction();
  drawToast();
  if (menuOpen) drawMenu();
  if (modal) drawModal();

  if (introT > 0 && state === 'play') {
    introT -= dt;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(W/2 - 270, H - 112, 540, 76);
    ctx.font = 'bold 17px "Comic Sans MS", sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('WASD = move  |  LEFT CLICK = sword', W/2, H - 94);
    ctx.fillText('RIGHT CLICK = item  |  1-4 / WHEEL = switch', W/2, H - 72);
    ctx.fillText('ESC = settings  |  M = music', W/2, H - 50);
  }

  if (state === 'dead') drawDead();
}

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sdt = slow > 0 ? dt * 0.4 : dt; if (slow > 0) slow -= dt;
  update(sdt); draw(sdt);
  requestAnimationFrame(loop);
}
reset(); state = 'boot'; introT = 10;
requestAnimationFrame(loop);
